name: victor-os-prod

services:
  victor-os:
    # Remplacée en CI par l’image publiée sur ghcr.io (voir deploy-prod.yml).
    image: ghcr.io/feldrise/victor-os:latest
    container_name: victor-os-prod
    restart: unless-stopped
    ports:
      - "3008:3000"
    environment:
      NODE_ENV: production
      ANTHROPIC_API_KEY: "ANTHROPIC_API_KEY_PLACEHOLDER"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
